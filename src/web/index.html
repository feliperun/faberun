<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Faberun</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header id="top">
  <span class="brand">Faberun</span>
  <label class="field">project
    <select id="projectSelect" aria-label="Project" disabled title="Every project this repository's .runs holds today is this one; a project selector across repositories lands once state moves under the user home (R2, R4).">
      <option value="local" selected>this repository</option>
    </select>
  </label>
  <label class="field">campaign
    <select id="campaignSelect" aria-label="Campaign"></select>
  </label>
  <span class="spacer"></span>
  <span id="conn"><span class="dot"></span><span id="conntext">connecting…</span></span>
</header>
<main id="main">
  <p class="empty" id="emptyState">loading .runs …</p>
  <section id="specMap" class="band" hidden>
    <h2>Spec map</h2>
    <div id="specMapBody" class="card"></div>
  </section>
  <section id="chain" class="band" hidden>
    <h2>Campaign</h2>
    <div id="chainGoal" class="dim mono goalclamp" tabindex="0" role="button" aria-label="campaign goal, tap to show the rest on a narrow screen"></div>
    <div id="chainBody" class="card graphcard"></div>
  </section>
  <section id="phaseGraph" class="band" hidden>
    <h2>Open phase</h2>
    <div id="phaseGraphHead" class="phasehead"></div>
    <div id="phaseGraphBody" class="card graphcard"></div>
  </section>
  <section id="drilldown" class="band" hidden>
    <h2>Node detail</h2>
    <div id="drilldownBody" class="card"><p class="empty">select a node above</p></div>
  </section>
</main>
<script type="module" src="/app.mjs"></script>
</body>
</html>
