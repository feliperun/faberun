name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: test/plan/existing-specs.test.mjs resolves each spec's
          # baseline commit under --strict-traceability (measured 2026-09-17: a
          # depth-1 checkout fails it on every runner).
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run check
      - run: npm run typecheck
      # The suite's whole-run effect, measured where the suite runs: a CI
      # runner starts with no ~/.faberun, so if the file exists after npm
      # test, some test escaped the scoped home (test/repo/source-shape.test.mjs
      # holds the static shapes) and reached the operator's real one. Measured
      # 2026-09-21: this repository's ~/.faberun/projects held 394 records, of
      # which test/contract/derived-fields.test.mjs alone wrote 27, 29 and 36
      # on three consecutive days, after the same leak had already been fixed
      # twice, one file at a time. The assertion is folded into the npm test
      # step as a plain multi-line scalar -- it runs immediately after the
      # suite, in the same step -- because test/host/ci-policy.test.mjs pins
      # this job's run-step list, and this is npm test's postcondition, not a
      # new stage of the pipeline.
      - run: npm test
          && test ! -e "$HOME/.faberun"
      - run: node evals/run.mjs --class deterministic --assert-no-model
      - run: node evals/run.mjs --class deterministic --verify-discriminating

  # Windows runs the same commands as the matrix above, because the suite is
  # green there now. What closing it found — a detached controller that died
  # with its launcher, a controller that never terminated its own provider, a
  # notification that never arrived — and the limits that remain are recorded
  # in docs/adr/0010-the-suite-runs-on-windows.md.
  windows:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, for the same reason the matrix above needs it:
          # test/plan/existing-specs.test.mjs resolves each spec's baseline
          # commit under --strict-traceability.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # bash, not the pwsh a Windows runner defaults to: the steps below are
      # the same strings the matrix above runs, and `test ! -e` is one of
      # them. Git Bash is on every windows-latest image, and its $HOME is
      # the same directory `os.homedir()` answers there.
      - run: npm ci
        shell: bash
      - run: npm run check
        shell: bash
      - run: npm run typecheck
