name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: test/plan/existing-specs.test.mjs resolves each spec's
          # baseline commit under --strict-traceability (measured 2026-09-17: a
          # depth-1 checkout fails it on every runner).
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run check
      - run: npm run typecheck
      - run: npm test
      - run: node evals/run.mjs --class deterministic --assert-no-model
      - run: node evals/run.mjs --verify-discriminating
